[project]
name = "localmesh-agent"
# 1.0.0rc1 (PEP 440) == SemVer "1.0.0-rc.1" — the AGENT_VERSION surfaced by
# GET /mesh/v1/info (NFR-COMP-02). tests/unit/test_release_engineering.py
# pins the two spellings in sync. Release candidate per M9 (§22.1).
version = "1.0.0rc1"
description = "LocalMesh AI Desktop Agent — Mesh API service exposing local inference Backends (LM-ARCH-001)"
requires-python = ">=3.12"
# Q-08 RESOLVED (owner, 2026-10-05): project license is Apache-2.0 (per the
# M9 decision brief recommendation in docs/RELEASE.md — patent grant; the only
# non-permissive dependency, zeroconf LGPL-2.1-or-later, is handled via
# docs/THIRD-PARTY-NOTICES.md). Full text: LICENSE at the repository root.
license = "Apache-2.0"
dependencies = [
    # §21.2 technology baseline. Names only here: exact versions are pinned in
    # agent/requirements.txt, generated FROM THE REGISTRY at M0 (WP-02) and
    # committed per §17.11. Never type versions from memory (AGENTS.md).
    "fastapi",              # ADR-002
    "uvicorn",              # ADR-002
    "httpx",                # ADR-002 (async)
    "pydantic>=2,<3",       # Pydantic v2 is contractual (ADR-002)
    "pydantic-settings",    # §10.1 config.py
    "cryptography",         # §21.2; used by security/tls.py, security/crypto.py
    "zeroconf",             # python-zeroconf (§21.2); PyPI distribution name confirmed by WP-02
    "psutil",               # §21.2
    "keyring",              # §21.2
]

[project.optional-dependencies]
nvidia = [
    # §21.2 names "pynvml" and defers the distribution name to the WP-02 spike
    # (AGENTS.md: "Never type versions from memory" — pin lives in
    # requirements.txt). pynvml 13.x is deprecated upstream in favour of
    # NVIDIA's nvidia-ml-py, which ships the same `pynvml` module; the swap was
    # triggered at M5 by the deprecation FutureWarning, per the WP-02 report's
    # pre-registered decision rule. See docs/adr/018-nvidia-ml-py.md.
    "nvidia-ml-py",
]
dev = [
    "ruff",                 # §21.2 agent tooling
    "mypy",                 # §21.2 (mypy --strict on core/ and security/)
    "pytest",               # §21.2
    "pytest-asyncio",       # §21.2
    "import-linter",        # §21.2 (dependency rule §10.1)
    "pip-audit",            # §21.4 security gates, §17.11
]

[build-system]
# ADR-017 (docs/adr/017-python-build-backend.md) — Proposed, pending owner
# approval: a PEP 517 build backend is required to install the Agent package;
# setuptools chosen per CON-05 ("boring, well-documented tech").
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"        # WP-05/06: async adapters, registry, SSE tests

[tool.mypy]
strict = true                # §21.2: mypy --strict on core/ and security/ (paths passed by CI)
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["localmesh_agent"]
